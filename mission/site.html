<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학생 탐구 웹</title>
  <style id="siteStyle">
    body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #faf9f6; color: #1d1d1b; }
    .msg { max-width: 560px; margin: 80px auto; padding: 24px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="msg" id="msg">학생이 만든 탐구 웹을 불러오는 중이에요…</div>
  <script src="../js/sitegen.js"></script>
  <script>
    (async function () {
      var msg = document.getElementById("msg");
      var code = location.hash.slice(1);
      if (!code) { msg.textContent = "열 수 있는 탐구 웹이 없어요. 친구에게 받은 공유 링크 전체를 그대로 열어 주세요."; return; }
      try {
        var site = await window.SiteGen.decode(code);
        document.getElementById("siteStyle").textContent = window.SiteGen.css(site);
        document.title = site.title;
        document.body.innerHTML = window.SiteGen.body(site);
        window.SiteGen.bindQuiz(document);
      } catch (e) {
        msg.textContent = e && e.message === "old-browser"
          ? "이 기기의 브라우저가 오래되어 이 링크를 열 수 없어요. 친구에게 HTML 파일로 받아 보세요."
          : "링크가 잘렸거나 잘못된 것 같아요. 공유 링크 전체를 다시 복사해 열어 주세요.";
      }
    })();
  </script>
</body>
</html>
